# Implantação em VPS Hostinger, seguindo o roteamento Traefik do ATRIA.
# Valores sensíveis devem ser definidos apenas no ambiente da VPS.
services:
  financeiro:
    build:
      context: https://github.com/juniorsousa-oss/GESTAO-FINANCEIRA.git#main
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL no servidor}
      SUPABASE_KEY: ${SUPABASE_KEY:?Configure SUPABASE_KEY no servidor}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-}
      APP_OWNER_NAME: ${APP_OWNER_NAME:-Júnior}
    expose:
      - "8501"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.financeiro.rule=Host(`financeiro.nexonlabs.com.br`)"
      - traefik.http.routers.financeiro.entrypoints=websecure
      - traefik.http.routers.financeiro.tls=true
      - traefik.http.routers.financeiro.tls.certresolver=letsencrypt
      - traefik.http.services.financeiro.loadbalancer.server.port=8501
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
