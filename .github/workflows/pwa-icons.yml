name: Build AXORA PWA icons
on:
  push:
    branches: [develop]
    paths:
      - 'scripts/build_pwa_icons.py'
      - 'axora_v2/static/axora-mark.svg'
      - '.github/workflows/pwa-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow cairosvg
      - run: python scripts/build_pwa_icons.py
      - name: Commit installation icons to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add axora_v2/static/pwa/icon-192.png axora_v2/static/pwa/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(pwa): add AXORA install icons"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
