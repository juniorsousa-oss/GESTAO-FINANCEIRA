name: AXORA web v2 checks
on:
  pull_request:
    paths:
      - 'axora_v2/**'
      - '.github/workflows/axora-v2.yml'
  push:
    branches:
      - main
      - develop
      - feature/axora-family-v2
      - feat/axora-web-v2-20261009
    paths:
      - 'axora_v2/**'
      - '.github/workflows/axora-v2.yml'
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: axora_v2/requirements.txt
      - run: pip install -r axora_v2/requirements.txt pytest httpx
      - run: pip install pglast
      - name: Validar sintaxe das migrações familiares PostgreSQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for file_name in ("20261116_family_v2.sql","20261116_same_project_beta_schema.sql","20261116_family_hierarchy_management.sql","20261117_family_single_registry.sql","20261117_provision_planned_shares.sql","20261117_family_wallet_payment_sources.sql"):
            path=Path("axora_v2/migrations")/file_name
            statements=parse_sql(path.read_text())
            assert len(statements) >= 5, f"Migração incompleta: {file_name}"
            print(f"PostgreSQL parse validado: {file_name}, {len(statements)} instruções")
          PY
      - run: python -m compileall -q axora_v2
      - run: python -m pytest axora_v2/tests -q
      - run: node --check axora_v2/static/app.js
      - run: node --check axora_v2/static/provisions.js
      - run: node --check axora_v2/static/auto-sync.js
      - run: node --check axora_v2/static/catalogs.js
      - run: node --check axora_v2/static/banking.js
      - run: node --check axora_v2/static/family.js
      - run: node --check axora_v2/static/brand-kit.js
      - run: node --check axora_v2/static/ios-pwa-stability.js
      - run: node axora_v2/tests/ios_pwa_keyboard_runtime.cjs
      - run: node axora_v2/tests/ui_runtime.cjs
      - run: node axora_v2/tests/family_payment_runtime.cjs
      - run: node axora_v2/tests/mobile_drawer_runtime.cjs
      - name: Validar layout mobile e teclado com navegador Chromium real
        run: |
          python -m pip install playwright
          export SUPABASE_URL=https://example.supabase.co
          export SUPABASE_KEY=chave-de-testes-sem-acesso
          export SESSION_SECRET=teste-aleatorio-de-mais-de-trinta-e-dois-caracteres
          export COOKIE_SECURE=0
          python -m uvicorn axora_v2.main:app --host 127.0.0.1 --port 18081 > /tmp/axora-ios.log 2>&1 &
          APP_PID=$!
          trap 'cat /tmp/axora-ios.log; kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 1
          done
          AXORA_SMOKE_URL=http://127.0.0.1:18081/ python axora_v2/tests/ios_pwa_browser_smoke.py
          AXORA_SMOKE_URL=http://127.0.0.1:18081/ python axora_v2/tests/modal_scroll_browser_smoke.py
          AXORA_SMOKE_URL=http://127.0.0.1:18081/ python axora_v2/tests/action_menu_browser_smoke.py
      - run: docker build --tag axora-v2-ci .
      - name: Testar inicialização real da imagem
        run: |
          docker run -d --name axora-v2-smoke -p 127.0.0.1:18080:8000 \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_KEY=chave-de-testes-sem-acesso \
            -e SESSION_SECRET=teste-aleatorio-de-mais-de-trinta-e-dois-caracteres \
            axora-v2-ci
          trap 'docker logs axora-v2-smoke; docker rm -f axora-v2-smoke' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              curl -fsS http://127.0.0.1:18080/ | grep -q 'AXORA'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - run: |
          if grep -R -E '^import streamlit|^from streamlit' axora_v2 --include='*.py'; then
            echo "O AXORA v2 não pode importar Streamlit."
            exit 1
          fi
