# Substituir o serviço Streamlit somente depois de validar a homologação.
# O nome do PROJETO da Hostinger pode continuar gestao-financeira.
services:
  axora-web:
    build:
      context: https://github.com/juniorsousa-oss/GESTAO-FINANCEIRA.git#main
      dockerfile: axora_v2/Dockerfile
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Configure na VPS}
      SUPABASE_KEY: ${SUPABASE_KEY:?Configure na VPS}
      SESSION_SECRET: ${SESSION_SECRET:?Crie um segredo aleatorio com ao menos 32 caracteres}
      COOKIE_SECURE: "1"
    expose:
      - "8000"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.axora.rule=Host(`axora.nexonlabs.com.br`)"
      - traefik.http.routers.axora.entrypoints=websecure
      - traefik.http.routers.axora.tls=true
      - traefik.http.routers.axora.tls.certresolver=letsencrypt
      - traefik.http.services.axora.loadbalancer.server.port=8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
